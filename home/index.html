<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TheWoWDB — Browse by Category</title>
  <link rel="stylesheet" href="/preview.css">
  <link rel="stylesheet" href="/assets/wgf-home.css">
</head>
<body class="wgf-shell-page" data-wgf-page="home">
  <div class="hm-pagebg" aria-hidden="true"></div>
  <main class="hm-hero">
    <section class="wgf-window hm-plate" aria-labelledby="hm-now-title">
      <header class="wgf-window__title" id="hm-now-title">Right Now in WoW</header>
      <p class="hm-pulse-realm">Proudmoore — US · High</p>
    </section>
    <section class="hm-profbook wgf-parchment-pane" aria-labelledby="browse-cat-title">
      <h2 id="browse-cat-title" class="wgf-parchment-pane__title">Browse by Category</h2>
      <div class="hm-profbook__grid">
        <button class="catchip" type="button" data-cat="herb">Herbs</button>
        <button class="catchip" type="button" data-cat="ore">Ore &amp; Stone</button>
        <button class="catchip" type="button" data-cat="enchanting">Enchanting</button>
        <button class="catchip" type="button" data-cat="potion">Potions &amp; Flasks</button>
        <button class="catchip" type="button" data-cat="jewelcrafting">Jewelcrafting</button>
        <button class="catchip" type="button" data-cat="armor">Armor / Transmog</button>
        <button class="catchip" type="button" data-cat="weapon">Weapons</button>
        <button class="catchip" type="button" data-cat="recipe">Recipes</button>
        <button class="catchip" type="button" data-cat="mount">Mounts</button>
      </div>
    </section>
  </main>
</body>
</html>
