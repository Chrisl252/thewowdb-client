<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="swTitle swDesc">
  <title id="swTitle">Stormwind City</title>
  <desc id="swDesc">In-game Stormwind City map. Cathedral of Light sits at 51.6, 44.4  Reckfuls tribute pin.</desc>
  <defs>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2416"/>
      <stop offset="55%" stop-color="#1c1810"/>
      <stop offset="100%" stop-color="#14110b"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3344"/>
      <stop offset="100%" stop-color="#0d1c28"/>
    </linearGradient>
    <linearGradient id="keep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d5a38"/>
      <stop offset="100%" stop-color="#3a2e1a"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a44a"/>
      <stop offset="100%" stop-color="#7a5c1c"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0.4" stdDeviation="0.35" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="100" height="100" fill="url(#land)"/>
  <path d="M0 0 H100 V18 C86 10 70 8 52 6 C34 8 16 14 0 22 Z" fill="#1a2214" opacity="0.55"/>
  <path d="M0 78 C18 86 38 92 58 94 C78 92 92 84 100 76 V100 H0 Z" fill="#152018" opacity="0.45"/>

  <!-- Harbor / South Shore -->
  <path d="M38 86 C46 82 58 82 68 86 C74 90 76 96 70 100 H42 C36 96 34 90 38 86 Z" fill="url(#water)"/>
  <path d="M44 90 h4 v6 h-4 z M52 89 h5 v7 h-5 z M61 91 h4 v5 h-4 z" fill="#3a2c18" opacity="0.85"/>

  <!-- Canals (Stormwinds signature loop) -->
  <path d="M48 86
           C46 78 44 72 40 68
           C34 62 32 56 36 50
           C40 44 48 42 54 46
           C62 51 70 56 74 62
           C78 68 76 76 68 80
           C60 84 54 86 48 86 Z" fill="none" stroke="#163044" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M48 86
           C46 78 44 72 40 68
           C34 62 32 56 36 50
           C40 44 48 42 54 46
           C62 51 70 56 74 62
           C78 68 76 76 68 80
           C60 84 54 86 48 86 Z" fill="none" stroke="#2a6a86" stroke-width="1.15" stroke-linejoin="round" opacity="0.85"/>
  <path d="M50 22 C51 30 51 36 51.6 42" fill="none" stroke="#163044" stroke-width="1.6"/>
  <path d="M50 22 C51 30 51 36 51.6 42" fill="none" stroke="#2a6a86" stroke-width="0.7" opacity="0.8"/>

  <!-- Stormwind Keep -->
  <path d="M42 8 L50 4 L58 8 L60 18 L54 22 L46 22 L40 18 Z" fill="url(#keep)" stroke="#c9a44a" stroke-width="0.35" filter="url(#soft)"/>
  <rect x="47.4" y="7.2" width="5.2" height="7.2" fill="url(#roof)"/>
  <path d="M46 8 h8 l-4 -3 z" fill="#e6c56a"/>

  <!-- Dwarven District -->
  <path d="M60 24 C68 20 78 24 80 34 C78 42 68 44 60 40 C56 34 56 28 60 24 Z" fill="#2c2618" stroke="#5a4a2c" stroke-width="0.3"/>
  <!-- Old Town -->
  <path d="M70 48 C80 44 90 50 88 62 C84 70 74 70 68 64 C64 58 64 50 70 48 Z" fill="#2a2016" stroke="#5a4a2c" stroke-width="0.3"/>
  <!-- Trade District -->
  <path d="M52 64 C62 60 72 64 74 74 C70 82 58 84 50 78 C46 72 46 66 52 64 Z" fill="#332818" stroke="#6a542c" stroke-width="0.3"/>
  <!-- Mage Quarter -->
  <path d="M30 66 C42 62 50 68 50 78 C44 86 32 88 26 80 C24 72 26 68 30 66 Z" fill="#243040" stroke="#4a6a7a" stroke-width="0.3"/>
  <!-- Cathedral Square -->
  <path d="M42 32 C52 28 62 32 64 42 C60 52 50 54 42 50 C38 42 38 34 42 32 Z" fill="#3a3220" stroke="#d4b45a" stroke-width="0.45"/>

  <!-- Cathedral of Light -->
  <path d="M48.4 38.2 h6.4 v4.6 h-6.4 z" fill="#4a4030" stroke="#e8c86a" stroke-width="0.35"/>
  <path d="M47.2 38.2 h8.8 l-4.4 -4.8 z" fill="url(#roof)"/>
  <path d="M50.8 36.2 h1.6 v2.2 h-1.6 z" fill="#f0d078"/>
  <circle cx="51.6" cy="41.2" r="0.55" fill="#ffe9a8"/>

  <g fill="#d8c48a" font-family="Palatino, 'Times New Roman', serif" font-size="2.15" letter-spacing="0.04" opacity="0.92">
    <text x="50" y="16.2" text-anchor="middle">Keep</text>
    <text x="70" y="33.2" text-anchor="middle">Dwarven</text>
    <text x="78" y="58.4" text-anchor="middle">Old Town</text>
    <text x="61" y="74.6" text-anchor="middle">Trade</text>
    <text x="38" y="77.8" text-anchor="middle">Mage</text>
    <text x="53" y="93.4" text-anchor="middle">Harbor</text>
    <text x="51.6" y="31.4" text-anchor="middle">Cathedral Square</text>
  </g>
</svg>
