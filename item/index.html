<!DOCTYPE html>
<html lang="en" class="wgf-navskin-game">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thunderfury — TheWoWDB</title>
  <link rel="stylesheet" href="/preview.css">
  <link rel="stylesheet" href="/assets/wgf-site-shell.css">
  <link rel="stylesheet" href="/assets/wgf-chrome.css">
</head>
<body class="wgf-shell-page" data-wgf-page="item">
  <header class="wgf-shell-topbar">
    <div class="wgf-shell-topbar__inner">
      <a class="wgf-shell-logo" href="/" aria-label="TheWoWDB - Home">TheWoWDB</a>
      <nav id="wgf-primary-nav" class="wgf-shell-nav" aria-label="Primary navigation">
        <a class="wgf-nav-link is-active" href="/item/">Item Prices</a>
        <a class="wgf-nav-link" href="/guides/">Guides</a>
      </nav>
    </div>
    <div class="wgf-shell-searchband">
      <form class="wgf-shell-search wgf-shell-search--prime" role="search" action="/search/" method="get">
        <input class="wgf-shell-search__input" type="search" name="q" placeholder="Search" aria-label="Search">
        <button class="wgf-shell-search__btn" type="submit" aria-label="Search">⌕</button>
      </form>
    </div>
  </header>

  <main class="preview-note">
    <p><strong>Inner page</strong> — this template also omits <code>.wgf-shell-right</code>. After navigation the chip must still show <strong>Alterrboy · Proudmoore US · Retail</strong>, not just a character name.</p>
    <div class="preview-nav">
      <a href="/">Home</a>
      <a href="/guides/">Guides</a>
    </div>
  </main>

  <script>
    try {
      localStorage.setItem("wgf-auth-account", "Alterrboy");
      localStorage.setItem("wgf-ah-realm", "proudmoore");
      localStorage.setItem("wgf-ah-realm-name", "Proudmoore");
      localStorage.setItem("wgf-ah-region", "us");
      localStorage.setItem("wgf-ah-game", "retail");
    } catch (e) {}
  </script>
  <script src="/assets/wgf-header-identity.js"></script>
  <script src="/assets/wgf-shell.js"></script>
</body>
</html>
